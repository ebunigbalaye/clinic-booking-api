
services:
  db:
    image: postgres:17
    container_name: clinic-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: clinic_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_user -d clinic_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
